name: linux-release-build

on:
  push:
    branches: [ release ]
  workflow_dispatch:

concurrency:
  group: release-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set rolling release tag
        run: echo "REL=release-latest" >> $GITHUB_ENV

      - name: Install LLVM 21 and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

          sudo apt-get install -y \
            ninja-build \
            clang-21 \
            clang-tools-21 \
            llvm-21-dev \
            libclang-21-dev

      - name: Set LLVM root
        run: echo "LLVM_ROOT=/usr/lib/llvm-21" >> $GITHUB_ENV

      - name: Clean build
        run: rm -rf build

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DLLVM_ROOT=$LLVM_ROOT \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          mkdir -p release
          cp bin/clang-mirror release/
          tar -czf clang-mirror-linux.tar.gz -C release .

      - name: Update rolling tag
        run: |
          git tag -f $REL
          git push origin $REL --force

      - name: Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$REL" \
            --title "Rolling Release" \
            --notes "Latest build from release branch" \
            || true

      - name: Upload asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$REL" \
            clang-mirror-linux.tar.gz \
            --clobber
