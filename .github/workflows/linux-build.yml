name: linux-build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        run: echo "REL=main-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Install LLVM 21 and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            gnupg \
            lsb-release \
            software-properties-common

          # Install LLVM 21 from official repository
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

          sudo apt-get install -y \
            ninja-build \
            clang-21 \
            clang-tools-21 \
            llvm-21-dev \
            libclang-21-dev

      - name: Set LLVM root
        run: echo "LLVM_ROOT=/usr/lib/llvm-21" >> $GITHUB_ENV

      - name: Clean build
        run: rm -rf build

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DLLVM_ROOT=$LLVM_ROOT \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          mkdir -p release
          cp build/bin/clang-mirror release/
          tar -czf clang-mirror-linux.tar.gz -C release .

      - name: Ensure release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$REL" --title "$REL" --notes "Auto build from main" || true

      - name: Upload asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$REL" clang-mirror-linux.tar.gz --clobber
