name: linux-build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        run: echo "REL=main-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            llvm-dev \
            libclang-dev \
            clang-tools

      - name: Detect LLVM root
        run: |
          LLVM_ROOT=$(ls -d /usr/lib/llvm-* | sort -V | tail -n 1)
          echo "LLVM_ROOT=$LLVM_ROOT" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DLLVM_ROOT=$LLVM_ROOT \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          mkdir release
          cp bin/clang-mirror release/
          tar -czf clang-mirror-linux.tar.gz -C release .

      - name: Ensure release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$REL" --title "$REL" --notes "Auto build from main" || true

      - name: Upload asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$REL" clang-mirror-linux.tar.gz --clobber
