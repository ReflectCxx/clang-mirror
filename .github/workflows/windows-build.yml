name: windows-build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      LLVM_VERSION: 21.1.0
      LLVM_DIR_NAME: clang+llvm-21.1.0-x86_64-pc-windows-msvc

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Download LLVM bundle
      # --------------------------------------------------
      - name: Download LLVM bundle
        shell: pwsh
        run: |
          curl -L -o llvm.tar.xz `
            https://github.com/llvm/llvm-project/releases/download/llvmorg-${env:LLVM_VERSION}/${env:LLVM_DIR_NAME}.tar.xz

      - name: Extract LLVM bundle
        shell: pwsh
        run: |
          tar -xf llvm.tar.xz
          Rename-Item "${env:LLVM_DIR_NAME}" llvm

      # --------------------------------------------------
      # Configure
      # --------------------------------------------------
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DLLVM_ROOT="$pwd/llvm"

      # --------------------------------------------------
      # Build
      # --------------------------------------------------
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      # --------------------------------------------------
      # Package
      # --------------------------------------------------
      - name: Package binary
        shell: pwsh
        run: |
          mkdir release
          copy build/bin/Release/clang-mirror.exe release/
          Compress-Archive release clang-mirror-windows.zip

      # --------------------------------------------------
      # Create Release if missing
      # --------------------------------------------------
      - name: Ensure Release exists
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} --generate-notes || exit 0

      # --------------------------------------------------
      # Upload asset to Release
      # --------------------------------------------------
      - name: Upload asset
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} `
            clang-mirror-windows.zip `
            --clobber
