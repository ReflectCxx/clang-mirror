name: windows-build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      LLVM_VERSION: 21.1.0
      LLVM_DIR_NAME: clang+llvm-21.1.0-x86_64-pc-windows-msvc

    steps:

      # ----------------------------
      # Checkout
      # ----------------------------
      - uses: actions/checkout@v4

      # ----------------------------
      # Compute version label
      # ----------------------------
      - name: Compute version
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0,7)
          echo "REL=main-$sha" >> $env:GITHUB_ENV

      # ----------------------------
      # Download LLVM
      # ----------------------------
      - name: Download LLVM
        shell: pwsh
        run: |
          curl -L -o llvm.tar.xz `
            https://github.com/llvm/llvm-project/releases/download/llvmorg-${env:LLVM_VERSION}/${env:LLVM_DIR_NAME}.tar.xz

      - name: Extract LLVM
        shell: pwsh
        run: |
          tar -xf llvm.tar.xz
          Rename-Item "${env:LLVM_DIR_NAME}" llvm

      # ----------------------------
      # Configure
      # ----------------------------
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DLLVM_ROOT="$pwd/llvm"

      # ----------------------------
      # Build
      # ----------------------------
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      # ----------------------------
      # Package
      # ----------------------------
      - name: Package
        shell: pwsh
        run: |
          mkdir release
          copy build/bin/Release/clang-mirror.exe release/
          Compress-Archive release clang-mirror-windows.zip

      # ----------------------------
      # Create release
      # ----------------------------
      - name: Create release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:REL `
            --title $env:REL `
            --notes "Auto build from main"

      # ----------------------------
      # Upload asset
      # ----------------------------
      - name: Upload asset
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $env:REL clang-mirror-windows.zip --clobber
